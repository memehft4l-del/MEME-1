<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOBO Dashboard - Configuration</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
            color: #fff;
        }
        
        .dashboard-container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        h1 {
            margin-bottom: 30px;
            text-align: center;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 14px;
        }
        
        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 14px;
        }
        
        input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        
        input:focus {
            outline: none;
            border-color: #4ade80;
            background: rgba(255, 255, 255, 0.15);
        }
        
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.5);
        }
        
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            display: none;
        }
        
        .status.success {
            background: rgba(74, 222, 128, 0.3);
            border: 1px solid #4ade80;
            display: block;
        }
        
        .status.error {
            background: rgba(239, 68, 68, 0.3);
            border: 1px solid #ef4444;
            display: block;
        }
        
        .info-box {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <h1>🥒 BOBO Dashboard</h1>
        
        <div class="info-box">
            <strong>Setup Instructions:</strong><br>
            1. Get your Supabase URL and anon key from your Supabase project settings<br>
            2. Update the SUPABASE_URL and SUPABASE_ANON_KEY in script.js<br>
            3. Run the SQL script (supabase-setup.sql) in your Supabase SQL Editor<br>
            4. Configure your links below and click Save
        </div>
        
        <form id="configForm">
            <div class="form-group">
                <label for="tokenAddress">Token Mint Address</label>
                <input type="text" id="tokenAddress" placeholder="Enter Solana token mint address" required>
            </div>
            
            <div class="form-group">
                <label for="dexscreenerLink">DexScreener Link</label>
                <input type="url" id="dexscreenerLink" placeholder="https://dexscreener.com/solana/...">
            </div>
            
            <div class="form-group">
                <label for="bagsLink">Bags App Link</label>
                <input type="url" id="bagsLink" placeholder="https://bags.fun/...">
            </div>
            
            <div class="form-group">
                <label for="twitterLink">Twitter Link</label>
                <input type="url" id="twitterLink" placeholder="https://twitter.com/...">
            </div>
            
            <button type="submit">Save Configuration</button>
        </form>
        
        <div id="status" class="status"></div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Supabase credentials
        const SUPABASE_URL = 'https://cwihyzlbsbbpchkheito.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_Y_MINoKzOLp1DBG23X0HZg_NR9gXzSk';
        
        let supabaseClient = null;
        
        // Initialize Supabase
        if (SUPABASE_URL && SUPABASE_URL !== 'YOUR_SUPABASE_URL') {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            
            // Load existing config
            loadConfig();
        } else {
            document.getElementById('status').className = 'status error';
            document.getElementById('status').textContent = 'Please configure Supabase credentials in dashboard.html';
        }
        
        async function loadConfig() {
            try {
                const { data, error } = await supabaseClient
                    .from('config')
                    .select('*')
                    .eq('id', 1)
                    .single();
                
                if (error) throw error;
                
                if (data) {
                    document.getElementById('tokenAddress').value = data.token_address || '';
                    document.getElementById('dexscreenerLink').value = data.dexscreener_link || '';
                    document.getElementById('bagsLink').value = data.bags_link || '';
                    document.getElementById('twitterLink').value = data.twitter_link || '';
                }
            } catch (error) {
                console.error('Error loading config:', error);
            }
        }
        
        document.getElementById('configForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const tokenAddress = document.getElementById('tokenAddress').value.trim();
            const dexscreenerLink = document.getElementById('dexscreenerLink').value.trim();
            const bagsLink = document.getElementById('bagsLink').value.trim();
            const twitterLink = document.getElementById('twitterLink').value.trim();
            
            // Auto-generate DexScreener link if token address provided but link is empty
            const finalDexscreenerLink = dexscreenerLink || 
                (tokenAddress ? `https://dexscreener.com/solana/${tokenAddress}` : '');
            
            try {
                const { error } = await supabaseClient
                    .from('config')
                    .upsert({
                        id: 1,
                        token_address: tokenAddress,
                        dexscreener_link: finalDexscreenerLink,
                        bags_link: bagsLink,
                        twitter_link: twitterLink
                    });
                
                if (error) throw error;
                
                document.getElementById('status').className = 'status success';
                document.getElementById('status').textContent = 'Configuration saved successfully!';
                
                setTimeout(() => {
                    document.getElementById('status').className = 'status';
                }, 3000);
            } catch (error) {
                console.error('Error saving config:', error);
                document.getElementById('status').className = 'status error';
                document.getElementById('status').textContent = 'Error saving configuration: ' + error.message;
            }
        });
    </script>
</body>
</html>
