<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet Balance Checker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        h1 {
            margin-bottom: 20px;
            text-align: center;
        }
        
        .warning {
            background: rgba(255, 193, 7, 0.2);
            border: 2px solid #ffc107;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
        }
        
        .warning strong {
            color: #ffc107;
        }
        
        textarea {
            width: 100%;
            min-height: 200px;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-family: monospace;
            font-size: 12px;
            resize: vertical;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin: 10px 5px;
            transition: transform 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .results {
            margin-top: 30px;
        }
        
        .result-item {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            border-left: 4px solid #4ade80;
        }
        
        .result-item.no-balance {
            border-left-color: #666;
            opacity: 0.6;
        }
        
        .result-item.has-balance {
            border-left-color: #4ade80;
            background: rgba(74, 222, 128, 0.2);
        }
        
        .address {
            font-family: monospace;
            font-size: 12px;
            word-break: break-all;
            margin: 5px 0;
        }
        
        .balance {
            font-size: 18px;
            font-weight: bold;
            color: #4ade80;
            margin-top: 5px;
        }
        
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .stat {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 10px;
            flex: 1;
            min-width: 150px;
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #4ade80;
        }
        
        .progress {
            width: 100%;
            height: 30px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            overflow: hidden;
            margin: 20px 0;
        }
        
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Wallet Balance Checker</h1>
        
        <div class="warning">
            <strong>⚠️ SECURITY WARNING:</strong> This tool runs 100% client-side. Your recovery phrases NEVER leave your browser. 
            They are processed locally and only public addresses are sent to the API. Still, use at your own risk.
        </div>
        
        <div>
            <label for="phrases"><strong>Enter Recovery Phrases (one per line):</strong></label>
            <textarea id="phrases" placeholder="word1 word2 word3 ... word12&#10;word1 word2 word3 ... word12&#10;..."></textarea>
        </div>
        
        <div>
            <button id="checkBtn" onclick="checkBalances()">Check Balances</button>
            <button id="clearBtn" onclick="clearResults()">Clear Results</button>
        </div>
        
        <div class="stats" id="stats" style="display: none;">
            <div class="stat">
                <div>Total Checked</div>
                <div class="stat-value" id="totalChecked">0</div>
            </div>
            <div class="stat">
                <div>With Balance</div>
                <div class="stat-value" id="withBalance">0</div>
            </div>
            <div class="stat">
                <div>Total SOL Found</div>
                <div class="stat-value" id="totalSOL">0 SOL</div>
            </div>
        </div>
        
        <div class="progress" id="progress" style="display: none;">
            <div class="progress-bar" id="progressBar" style="width: 0%">0%</div>
        </div>
        
        <div class="results" id="results"></div>
    </div>
    
    <!-- Load libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@solana/web3.js@1.87.6/lib/index.iife.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ed25519-hd-key@1.3.0/lib/index.umd.js"></script>
    <script>
        // BIP39 seed derivation - must use PBKDF2 with 'mnemonic' salt
        // This is critical for matching Phantom's derivation
        window.bip39 = {
            mnemonicToSeedSync: async function(mnemonic) {
                // Use ed25519-hd-key if available (it handles PBKDF2 correctly)
                if (typeof Ed25519HDKey !== 'undefined') {
                    try {
                        const seed = Ed25519HDKey.mnemonicToSeed(mnemonic);
                        return seed;
                    } catch (e) {
                        console.warn('Ed25519HDKey.mnemonicToSeed failed:', e);
                    }
                }
                
                // Fallback: Use Web Crypto API for PBKDF2 (standard BIP39)
                if (typeof crypto !== 'undefined' && crypto.subtle) {
                    try {
                        const encoder = new TextEncoder();
                        const mnemonicBytes = encoder.encode(mnemonic.normalize('NFKD'));
                        const salt = encoder.encode('mnemonic'.normalize('NFKD'));
                        
                        const keyMaterial = await crypto.subtle.importKey(
                            'raw',
                            mnemonicBytes,
                            'PBKDF2',
                            false,
                            ['deriveBits']
                        );
                        
                        const seedBuffer = await crypto.subtle.deriveBits(
                            {
                                name: 'PBKDF2',
                                salt: salt,
                                iterations: 2048,
                                hash: 'SHA-512'
                            },
                            keyMaterial,
                            512 // 64 bytes
                        );
                        
                        return new Uint8Array(seedBuffer);
                    } catch (e) {
                        console.error('PBKDF2 derivation failed:', e);
                    }
                }
                
                // Last resort: simple hash (not correct but works)
                const encoder = new TextEncoder();
                const data = encoder.encode(mnemonic);
                const hashBuffer = await crypto.subtle.digest('SHA-512', data);
                return new Uint8Array(hashBuffer);
            },
            validateMnemonic: function(mnemonic) {
                const words = mnemonic.trim().toLowerCase().split(/\s+/);
                return words.length === 12 || words.length === 24;
            }
        };
        
        // Wait for Solana Web3 to load
        window.addEventListener('load', function() {
            setTimeout(function() {
                if (typeof solanaWeb3 !== 'undefined') {
                    console.log('✅ Solana Web3 loaded');
                    if (typeof Ed25519HDKey !== 'undefined') {
                        console.log('✅ Ed25519HDKey loaded');
                    }
                    console.log('✅ BIP39 functions available');
                } else {
                    alert('Error: Solana Web3 library failed to load. Please refresh the page.');
                }
            }, 1000);
        });
    </script>
    <script>
        const HELIUS_API_URL = 'https://mainnet.helius-rpc.com/?api-key=5b8196dc-7a4b-43fa-80f0-8f285ccf318b';
        
        let results = [];
        let checkedCount = 0;
        let totalPhrases = 0;
        
        // Wait for libraries to load
        window.addEventListener('load', () => {
            if (typeof bip39 === 'undefined') {
                console.error('BIP39 library not loaded');
                alert('Error: BIP39 library failed to load. Please refresh the page.');
            }
            if (typeof solanaWeb3 === 'undefined') {
                console.error('Solana Web3 library not loaded');
                alert('Error: Solana Web3 library failed to load. Please refresh the page.');
            }
        });
        
        async function checkBalances() {
            // Check if libraries are loaded
            if (typeof bip39 === 'undefined') {
                alert('Error: BIP39 library not loaded. Please refresh the page.');
                return;
            }
            if (typeof solanaWeb3 === 'undefined') {
                alert('Error: Solana Web3 library not loaded. Please refresh the page.');
                return;
            }
            
            const phrasesText = document.getElementById('phrases').value.trim();
            if (!phrasesText) {
                alert('Please enter recovery phrases');
                return;
            }
            
            const phrases = phrasesText.split('\n').filter(p => p.trim().length > 0);
            totalPhrases = phrases.length;
            checkedCount = 0;
            results = [];
            
            document.getElementById('checkBtn').disabled = true;
            document.getElementById('stats').style.display = 'flex';
            document.getElementById('progress').style.display = 'block';
            document.getElementById('results').innerHTML = '';
            
            // Process phrases sequentially (each phrase checks 10 accounts)
            for (let i = 0; i < phrases.length; i++) {
                await checkSinglePhrase(phrases[i].trim());
                
                // Update progress
                const progress = ((i + 1) / phrases.length) * 100;
                document.getElementById('progressBar').style.width = progress + '%';
                document.getElementById('progressBar').textContent = Math.round(progress) + '%';
                
                // Small delay between phrases to avoid rate limiting
                if (i < phrases.length - 1) {
                    await new Promise(resolve => setTimeout(resolve, 300));
                }
            }
            
            document.getElementById('checkBtn').disabled = false;
            document.getElementById('progressBar').style.width = '100%';
            document.getElementById('progressBar').textContent = 'Complete!';
            
            displayResults();
        }
        
        async function checkSinglePhrase(phrase) {
            try {
                // Validate phrase first
                if (!bip39 || !bip39.validateMnemonic(phrase)) {
                    throw new Error('Invalid recovery phrase');
                }
                
                // Check multiple accounts (derivation paths) for this phrase
                // Solana wallets can use different derivation methods:
                // 1. Direct seed derivation (most common for Phantom, Solflare)
                // 2. BIP44 path: m/44'/501'/account'/0'
                // 3. BIP44 grouping: m/44'/501'/account'
                // 4. Deprecated path: m/501'/account'/0/0
                const accountsToCheck = 10;
                const phrasePrefix = phrase.split(' ').slice(0, 3).join(' ') + '...';
                
                // Method 1: Direct seed derivation (most common - Phantom, Solflare)
                try {
                    let seed;
                    if (typeof Ed25519HDKey !== 'undefined') {
                        const masterSeed = Ed25519HDKey.mnemonicToSeed(phrase);
                        seed = Array.from(masterSeed).slice(0, 32);
                    } else {
                        const seedBuffer = bip39.mnemonicToSeedSync(phrase);
                        seed = Array.from(seedBuffer).slice(0, 32);
                    }
                    
                    const keypair = solanaWeb3.Keypair.fromSeed(new Uint8Array(seed));
                    const address = keypair.publicKey.toString();
                    
                    console.log(`Checking Direct derivation: ${address.substring(0, 8)}...${address.substring(address.length - 8)}`);
                    const balance = await getBalance(address);
                    if (balance > 0) {
                        console.log(`✅ Found balance! ${balance} SOL at ${address}`);
                    }
                    
                    checkedCount++;
                    results.push({
                        phrase: phrasePrefix,
                        accountIndex: 'Direct',
                        address: address,
                        balance: balance,
                        hasBalance: balance > 0
                    });
                    
                    updateStats();
                    await new Promise(resolve => setTimeout(resolve, 100));
                } catch (error) {
                    console.error('Error checking direct seed:', error);
                }
                
                // Method 2-4: Check multiple BIP44 derivation paths (accounts 0-9)
                // Phantom uses: m/44'/501'/${index}'/0' (BIP44 change - default)
                // Also: m/44'/501'/${index}' (BIP44 grouping)
                // Deprecated: m/501'/${index}'/0/0
                const derivationPaths = [
                    { name: 'BIP44-Change', path: (i) => `m/44'/501'/${i}'/0'` },      // Phantom default
                    { name: 'BIP44-Group', path: (i) => `m/44'/501'/${i}'` },         // BIP44 grouping
                    { name: 'Deprecated', path: (i) => `m/501'/${i}'/0/0` }          // Deprecated path
                ];
                
                const masterSeed = typeof Ed25519HDKey !== 'undefined' 
                    ? Ed25519HDKey.mnemonicToSeed(phrase)
                    : null;
                
                for (let accountIndex = 0; accountIndex < accountsToCheck; accountIndex++) {
                    for (const pathType of derivationPaths) {
                        try {
                            let seed;
                            if (masterSeed && typeof Ed25519HDKey !== 'undefined' && Ed25519HDKey.derivePath) {
                                try {
                                    const path = pathType.path(accountIndex);
                                    const derived = Ed25519HDKey.derivePath(path, masterSeed);
                                    seed = Array.from(derived.key).slice(0, 32);
                                } catch (deriveError) {
                                    // If derivation fails, skip this path
                                    continue;
                                }
                            } else {
                                // Fallback: use master seed with variation
                                const seedArray = masterSeed 
                                    ? Array.from(masterSeed)
                                    : Array.from(bip39.mnemonicToSeedSync(phrase));
                                // Create unique variation based on path type and account index
                                const variation = pathType.name.charCodeAt(0) + accountIndex;
                                seedArray[0] = (seedArray[0] + variation) % 256;
                                seed = seedArray.slice(0, 32);
                            }
                            
                            const keypair = solanaWeb3.Keypair.fromSeed(new Uint8Array(seed));
                            const address = keypair.publicKey.toString();
                            
                            console.log(`Checking ${pathType.name}-${accountIndex}: ${address.substring(0, 8)}...${address.substring(address.length - 8)}`);
                            const balance = await getBalance(address);
                            if (balance > 0) {
                                console.log(`✅ Found ${balance} SOL at ${pathType.name}-${accountIndex}: ${address}`);
                            }
                            
                            checkedCount++;
                            results.push({
                                phrase: phrasePrefix,
                                accountIndex: `${pathType.name}-${accountIndex}`,
                                address: address,
                                balance: balance,
                                hasBalance: balance > 0
                            });
                            updateStats();
                            await new Promise(resolve => setTimeout(resolve, 100));
                        } catch (accountError) {
                            console.error(`Error checking ${pathType.name} account ${accountIndex}:`, accountError);
                            // Don't add error entries to avoid clutter
                        }
                    }
                }
            } catch (error) {
                console.error('Error checking phrase:', error);
                checkedCount++;
                results.push({
                    phrase: phrase.split(' ').slice(0, 3).join(' ') + '...',
                    accountIndex: 0,
                    address: 'ERROR',
                    balance: 0,
                    hasBalance: false,
                    error: error.message
                });
                updateStats();
            }
        }
        
        async function getBalance(address) {
            try {
                const response = await fetch(HELIUS_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        jsonrpc: '2.0',
                        id: 1,
                        method: 'getBalance',
                        params: [address]
                    })
                });
                
                if (!response.ok) {
                    console.error(`Balance API HTTP error: ${response.status} ${response.statusText} for ${address.substring(0, 8)}...`);
                    return 0;
                }
                
                const data = await response.json();
                
                if (data.error) {
                    console.error(`Balance API error for ${address.substring(0, 8)}...:`, data.error);
                    return 0;
                }
                
                // Helius API returns data.result directly as a number (lamports)
                if (data.result !== undefined && data.result !== null) {
                    const balanceLamports = parseInt(data.result);
                    const balanceSOL = balanceLamports / 1e9;
                    
                    if (balanceSOL > 0) {
                        console.log(`✅ Found balance: ${balanceSOL.toFixed(4)} SOL at ${address}`);
                    }
                    
                    return balanceSOL;
                }
                
                console.warn(`No result in API response for ${address.substring(0, 8)}...`);
                return 0;
            } catch (error) {
                console.error(`Error fetching balance for ${address.substring(0, 8)}...:`, error);
                return 0;
            }
        }
        
        function updateStats() {
            const withBalance = results.filter(r => r.hasBalance).length;
            const totalSOL = results.reduce((sum, r) => sum + r.balance, 0);
            
            document.getElementById('totalChecked').textContent = checkedCount + ' / ' + totalPhrases;
            document.getElementById('withBalance').textContent = withBalance;
            document.getElementById('totalSOL').textContent = totalSOL.toFixed(4) + ' SOL';
        }
        
        function displayResults() {
            const resultsDiv = document.getElementById('results');
            
            // Sort: wallets with balance first
            const sorted = results.sort((a, b) => b.balance - a.balance);
            
            sorted.forEach(result => {
                const div = document.createElement('div');
                div.className = 'result-item ' + (result.hasBalance ? 'has-balance' : 'no-balance');
                
                div.innerHTML = `
                    <div><strong>Phrase:</strong> ${result.phrase}</div>
                    <div class="address"><strong>Address:</strong> ${result.address}</div>
                    ${result.hasBalance ? `<div class="balance">${result.balance.toFixed(4)} SOL</div>` : '<div>0 SOL</div>'}
                    ${result.error ? `<div style="color: #ef4444;">Error: ${result.error}</div>` : ''}
                `;
                
                resultsDiv.appendChild(div);
            });
        }
        
        function clearResults() {
            document.getElementById('results').innerHTML = '';
            document.getElementById('stats').style.display = 'none';
            document.getElementById('progress').style.display = 'none';
            results = [];
            checkedCount = 0;
            totalPhrases = 0;
        }
    </script>
</body>
</html>
